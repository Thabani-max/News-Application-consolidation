{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Reset Your Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
    <link href="{% static 'grabsomore/styles.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
    <h2>Reset Password</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'grabsomore:reset_password' %}">
        {% csrf_token %}
        <input type="password" name="password" placeholder="New password" required><br><br>
        <input type="password" name="password_conf" placeholder="Confirm new password" required><br><br>
        <button type="submit" class="btn btn-primary">Reset Password</button>
  </form>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
