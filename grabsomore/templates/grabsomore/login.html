<!-- login -->
{% extends 'base.html' %}
{% block content %}
<h1>Login</h1>
{% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
<form method="POST" action="{% url 'grabsomore:login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>

<P>Don't have an account? <a href="{% url 'grabsomore:register' %}">Register</a></P>

<p>Forgot your password? <a href="{% url 'grabsomore:request_password_reset' %}">Reset Password</a></p>
{% endblock %}
