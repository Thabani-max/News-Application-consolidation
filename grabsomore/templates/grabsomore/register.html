<!-- register -->
{% extends 'base.html' %}
{% block content %}
<div class="register">
    <h1>Register</h1>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'grabsomore:register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Register</button>
    </form>
</div>
{% endblock content %}
