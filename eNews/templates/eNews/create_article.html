<!-- create article -->
{% extends 'base.html' %}
{% block title %}
    Create Article
{% endblock %}

{% block content %}
    <h1>Create Article</h1>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST" action="{% url 'eNews:create_article' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Create</button>
    </form>


<!-- Navigation Buttons -->
 <div style="margin-top: 10px;">

    <a href="{% url 'grabsomore:dashboard' %}">
        <button class="btn btn-secondary">Back To Home Page</button>
    </a>

 </div>

{% endblock %}
