<!-- Update Publisher -->
{% extends 'base.html' %}
{% block title %}
    Update Publisher
{% endblock %}
{% block content %}
    <h1>Update Publisher</h1>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Update</button>
    </form>


<!-- Navigation Buttons -->
 <div style="margin-top: 10px;">

    <a href="{% url 'eNews:publisher_list' %}">
        <button class="btn btn-secondary">Back to Publisher List</button>
    </a>

    <a href="{% url 'grabsomore:dashboard' %}">
        <button class="btn btn-secondary">Back To Home Page</button>
    </a>

 </div>
{% endblock %}
